<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CivicFlow — AI-Powered Civic Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --navy:#0B1B30;--navy9:#081120;--navy7:#17324F;--navy2:#B9C9DC;
  --elec:#1F6FEB;--eled:#1558BE;--elesoft:#E9F1FD;
  --civic:#F25C05;--civicd:#C94A02;--civicsoft:#FDEEE2;
  --ok:#178A4C;--oksoft:#E5F5EC;--warn:#C77700;--warnsoft:#FCF1DC;
  --crit:#D92D20;--critsoft:#FDEBE9;
  --ink:#101828;--ink7:#344054;--ink5:#667085;--ink4:#98A2B3;--ink3:#D0D5DD;
  --line:#E4E7EC;--paper:#F4F5F2;
  --sh:0 1px 2px rgba(16,24,40,.06);--pop:0 12px 32px rgba(8,17,32,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Public Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
h1,h2,h3,.disp{font-family:'Sora','Public Sans',sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#C9CED6;border-radius:8px;border:2px solid var(--paper)}::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid rgba(31,111,235,.55);outline-offset:1px;border-radius:6px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes ring{0%{transform:scale(.6);opacity:.7}80%{transform:scale(2.1);opacity:0}100%{opacity:0}}
@keyframes travel{0%{top:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:calc(100% - 8px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes skel{0%{background-position:-400px 0}100%{background-position:400px 0}}
.aUp{animation:fadeUp .45s cubic-bezier(.2,.7,.3,1) both}
.aIn{animation:fadeIn .35s ease both}
.aSlide{animation:slideR .3s cubic-bezier(.2,.7,.3,1) both}
.aPop{animation:popIn .2s cubic-bezier(.2,.7,.3,1) both}
.blink{animation:blink 1.6s ease-in-out infinite}
.spin{display:inline-block;animation:spin .9s linear infinite}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:600;transition:all .15s;white-space:nowrap;user-select:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.p{background:var(--navy);color:#fff}.btn.p:hover{background:var(--navy7)}
.btn.a{background:var(--civic);color:#fff;box-shadow:0 1px 3px rgba(242,92,5,.35)}.btn.a:hover{background:var(--civicd)}
.btn.e{background:var(--elec);color:#fff}.btn.e:hover{background:var(--eled)}
.btn.o{background:#fff;border:1px solid var(--line);color:var(--ink7)}.btn.o:hover{border-color:var(--ink3);background:#FAFAFB}
.btn.g{color:var(--ink5);padding:0 10px}.btn.g:hover{background:#EDEFF2;color:var(--ink)}
.btn.d{background:var(--crit);color:#fff}.btn.d:hover{background:#B42318}
.btn.sm{height:31px;padding:0 10px;font-size:12px;border-radius:7px;gap:5px}
.btn.lg{height:48px;padding:0 24px;font-size:15px;border-radius:12px}
.btn.wt{border:1px solid rgba(255,255,255,.25);color:#fff}.btn.wt:hover{background:rgba(255,255,255,.1)}
/* layout */
.shell{display:flex;min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--navy);z-index:50;display:flex;flex-direction:column;transition:transform .3s}
.main{flex:1;min-width:0;margin-left:248px;display:flex;flex-direction:column}
.side nav{flex:1;overflow-y:auto;padding:14px 12px}
.nsec{font-size:9.5px;font-weight:700;letter-spacing:.16em;color:rgba(185,201,220,.5);padding:16px 12px 6px;text-transform:uppercase}
.nitem{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:500;color:rgba(185,201,220,.85);position:relative;margin-bottom:2px}
.nitem:hover{color:#fff;background:rgba(255,255,255,.06)}
.nitem.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.nitem.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--elec)}
.top{position:sticky;top:0;z-index:40;background:rgba(244,245,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;height:64px;padding:0 22px}
.content{flex:1;padding:20px 22px;max-width:1500px;width:100%;margin:0 auto}
.foot{padding:14px 22px;border-top:1px solid var(--line);font-size:11px;color:var(--ink4);display:flex;flex-wrap:wrap;gap:6px 24px}
/* cards & forms */
.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh)}
.card.hover{transition:all .2s}.card.hover:hover{box-shadow:var(--pop);transform:translateY(-1px)}
.inp,.sel,.ta{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;transition:border .15s,box-shadow .15s}
.inp{height:38px;padding:0 12px}
.ta{padding:10px 12px;resize:none}
.sel{height:34px;padding:0 8px;font-size:13px;color:var(--ink7);cursor:pointer}
.inp:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--elec);box-shadow:0 0 0 3px rgba(31,111,235,.12)}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink5);margin-bottom:6px}
.sect{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sect h2{font-size:15px;color:var(--navy);display:flex;align-items:center;gap:9px}
.sect .sub{font-size:12px;color:var(--ink5);margin-top:2px}
.icobox{width:32px;height:32px;border-radius:9px;background:rgba(11,27,48,.06);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;flex:none}
/* badges */
.bdg{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 8px;font-size:10.5px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
.bdg.sm{padding:1px 6px;font-size:9.5px}
.dot{width:6px;height:6px;border-radius:99px;display:inline-block}
/* tables */
table{width:100%;border-collapse:collapse}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink5);white-space:nowrap;background:var(--paper);border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink7);vertical-align:middle}
tr.rrow{cursor:pointer;transition:background .12s}
tr.rrow:hover{background:rgba(244,245,242,.7)}
.th-sort{display:inline-flex;align-items:center;gap:3px;color:inherit;text-transform:inherit;letter-spacing:inherit;font:inherit}
/* kpi */
.kgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{padding:15px}
.kpi .v{font-family:'Sora';font-weight:800;font-size:26px;color:var(--navy);line-height:1;margin-top:10px}
.kpi .l{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink5);margin-top:6px}
.kpi .s{font-size:10.5px;color:var(--ink4);margin-top:2px}
.tr{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700}
/* grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gdash{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
/* toast */
#toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;width:330px;max-width:calc(100vw - 32px)}
.toast{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--pop);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;animation:slideR .3s cubic-bezier(.2,.7,.3,1) both}
.toast .msg{flex:1;font-size:13px;font-weight:500;color:var(--ink7);line-height:1.4}
.toast .act{font-size:12px;font-weight:700;color:var(--elec);flex:none;padding-top:1px}
.toast .act:hover{text-decoration:underline}
/* modal / drawer / dropdown */
.ovl{position:fixed;inset:0;z-index:100;background:rgba(8,17,32,.55);animation:fadeIn .25s both}
.mbox{position:fixed;z-index:101;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;box-shadow:var(--pop);width:min(440px,calc(100vw - 32px));animation:popIn .2s both}
.mbox-h{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);font-family:'Sora';font-weight:700;color:var(--navy)}
.mbox-b{padding:20px}
.drawer{position:fixed;z-index:101;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--paper);box-shadow:var(--pop);overflow-y:auto;animation:slideR .3s both}
.drawer-h{position:sticky;top:0;z-index:5;background:rgba(244,245,242,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.dd{position:absolute;z-index:90;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);animation:popIn .18s both;overflow:hidden}
.dd-h{padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4);border-bottom:1px solid var(--line)}
/* search box */
.sbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;height:36px;padding:0 11px;flex:1;max-width:420px}
.sbox:focus-within{border-color:var(--elec);box-shadow:0 0 0 3px rgba(31,111,235,.12)}
.sbox input{border:0;outline:0;background:none;flex:1;font-size:13px;min-width:0}
kbd{font-family:'JetBrains Mono';font-size:9.5px;color:var(--ink4);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.sres{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);z-index:95;overflow:hidden;animation:popIn .18s both}
.sres button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.sres button:last-child{border-bottom:0}
.sres button:hover{background:var(--paper)}
/* bell */
.bdot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;background:var(--crit);color:#fff;font-size:9.5px;font-weight:700;border-radius:99px;display:flex;align-items:center;justify-content:center}
.notif{display:flex;gap:12px;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.notif:hover{background:var(--paper)}
.notif.unread{background:rgba(233,241,253,.4)}
.nico{width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
/* map */
.leaflet-container{font-family:'Public Sans',sans-serif;font-size:12px;border-radius:12px;z-index:1}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 12px 32px rgba(8,17,32,.2)}
.leaflet-popup-content{margin:14px 16px;line-height:1.45;width:262px!important}
.pin{position:relative;width:18px;height:18px}
.pin i{position:absolute;inset:2px;border-radius:99px;background:var(--c);border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.pin.pulse::after{content:'';position:absolute;inset:-3px;border-radius:99px;border:2.5px solid var(--c);opacity:.65;animation:ring 1.5s ease-out infinite}
.pin.me::after{animation:none;inset:-5px;border:2.5px dashed var(--c);opacity:.9}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:13px;overflow:hidden;height:440px}
.mapwrap.tall{height:560px}.mapwrap.mini{height:180px}
.mapctl{position:absolute;top:12px;left:12px;z-index:600;display:flex;flex-wrap:wrap;gap:6px;max-width:80%}
.mbtn{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:8px;height:30px;padding:0 10px;font-size:11.5px;font-weight:700;color:var(--ink7);display:inline-flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.mbtn:hover{background:#fff}
.mbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mbtn .mq{border:0;outline:0;background:none;font-size:12px;width:110px}
.mapleg{position:absolute;bottom:12px;left:12px;z-index:600;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:9px;padding:8px 12px;display:flex;gap:14px;font-size:10.5px;font-weight:600;color:var(--ink5);flex-wrap:wrap}
.mapleg span{display:inline-flex;align-items:center;gap:6px}
.fmap{position:absolute;inset:0;background:#E2E7ED;background-image:linear-gradient(rgba(140,170,210,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(140,170,210,.25) 1px,transparent 1px);background-size:52px 52px}
.fdot{position:absolute;width:16px;height:16px;margin:-8px;border-radius:99px;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);cursor:pointer;transform:translateZ(0)}
.fdot.pulse::after{content:'';position:absolute;inset:-4px;border-radius:99px;border:2.5px solid var(--c);opacity:.65;animation:ring 1.5s ease-out infinite}
.fpop{position:absolute;z-index:650;width:280px;background:#fff;border-radius:12px;box-shadow:var(--pop);padding:14px 16px;animation:popIn .2s both}
/* kanban */
.kwrap{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:start}
.kcol{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:13px;padding:10px;min-height:280px;transition:background .15s,border-color .15s}
.kcol.over{background:#F0F6FF;border-color:#9DC0F7}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh);padding:12px;margin-bottom:10px;cursor:grab}
.kcard:active{cursor:grabbing}
.kcard.ghost{opacity:.4}
.kempty{border:1px dashed var(--ink3);border-radius:9px;padding:30px 10px;text-align:center;font-size:11.5px;color:var(--ink4)}
/* timeline */
.tl{position:relative;padding-left:4px}
.tl::before{content:'';position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tlrow{display:flex;gap:13px;position:relative;padding-bottom:16px}
.tldot{width:22px;height:22px;border-radius:99px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;flex:none;z-index:1}
/* landing */
.land{min-height:100vh;background:var(--navy9);color:#fff;display:flex;flex-direction:column;flex:1;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px}
.land-main{flex:1;background-image:linear-gradient(rgba(140,170,210,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(140,170,210,.06) 1px,transparent 1px);background-size:44px 44px}
.hero{max-width:1200px;margin:0 auto;padding:60px 28px 44px;display:grid;grid-template-columns:1.15fr 1fr;gap:56px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.18em;color:#C7DBFB;background:rgba(31,111,235,.12);border:1px solid rgba(31,111,235,.35);border-radius:99px;padding:6px 14px}
.plnode{position:relative;margin-left:2px;border:1px solid rgba(150,180,220,.22);background:rgba(13,29,52,.75);border-radius:13px;padding:12px 16px 12px 48px;transition:all .3s}
.plnode.lit{border-color:#2E7CEE;background:rgba(31,111,235,.16);box-shadow:0 0 0 1px rgba(46,124,238,.35)}
.plnum{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:99px;background:var(--navy9);border:2px solid var(--elec);color:var(--elec);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.plline{position:absolute;left:19px;top:16px;bottom:16px;width:2px;background:rgba(255,255,255,.1);border-radius:2px}
.plcar{position:absolute;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:99px;background:var(--elec);box-shadow:0 0 12px #1F6FEB;animation:travel 3.6s ease-in-out infinite}
.stat{background:rgba(11,27,48,.6);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.on{color:var(--ok);font-size:10.5px;font-weight:800;letter-spacing:.08em;display:inline-flex;align-items:center;gap:6px}
.tickline{display:flex;gap:12px;font-size:12.5px;background:rgba(11,27,48,.5);border:1px solid rgba(255,255,255,.05);border-radius:9px;padding:10px 12px;animation:fadeUp .4s both}
/* citizen */
.cz-wrap{max-width:640px;margin:0 auto;padding:32px 18px 56px}
.drop{border:2px dashed var(--ink3);border-radius:13px;padding:24px;text-align:center;cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:var(--elec);background:rgba(233,241,235,0)}
.drop.over{background:rgba(31,111,235,.06)}
.aistage{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;transition:all .3s}
.aistage.done{border-color:rgba(23,138,76,.25);background:rgba(229,245,236,.5)}
.aistage.act{border-color:rgba(31,111,235,.3);background:rgba(233,241,253,.4)}
/* field */
.phone{max-width:430px;margin:0 auto}
.ph-h{background:var(--navy);color:#fff;border-radius:22px 22px 0 0;padding:22px 20px 18px}
.ph-b{border:1px solid var(--line);border-top:0;border-radius:0 0 22px 22px;background:var(--paper);padding:16px;min-height:380px}
.team-sel{width:100%;height:40px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:600;padding:0 10px;outline:none}
.team-sel option{color:var(--ink)}
/* presentation */
.present{position:fixed;inset:0;z-index:150;background:var(--navy9);color:#fff;overflow-y:auto;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px}
.pnode{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pcirc{width:36px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.25);background:var(--navy9);color:rgba(185,201,220,.6);font-size:11px;font-weight:700;transition:all .3s}
.pnode.done .pcirc{background:var(--elec);border-color:var(--elec);color:#fff;box-shadow:0 0 16px rgba(31,111,235,.6)}
.pnode.done .plabel{color:#fff}
.pnode.done::after{content:'✓';position:absolute;top:-6px;right:calc(50% - 26px);width:16px;height:16px;border-radius:99px;background:var(--elec);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.prail{position:absolute;left:0;right:0;top:18px;height:2px;background:rgba(255,255,255,.1)}
.prail-fill{position:absolute;left:0;top:0;height:100%;background:var(--elec);transition:width .7s}
/* misc */
.tgl{width:40px;height:22px;border-radius:99px;background:#CBD2DB;position:relative;transition:background .2s;flex:none}
.tgl.on{background:var(--ok)}
.tgl i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.tgl.on i{left:20px}
.empty{text-align:center;padding:48px 24px;animation:fadeIn .35s both}
.empty .eico{width:54px;height:54px;border-radius:16px;background:#EEF0F3;color:var(--ink4);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.empty h3{font-size:16px;color:var(--navy)}
.empty p{font-size:13px;color:var(--ink5);margin-top:6px;max-width:320px;margin-left:auto;margin-right:auto;line-height:1.5}

var STOP={};('a an the and or at in on to of for with near nearby reported report again causing cause during very is are was were has have been this that it its there by from also but not please kindly since while after before being into onto over under due every when').split(' ').forEach(function(w){STOP[w]=1;});
var RULES=[
 {cat:'Road Damage',kw:['pothole','road','crack','asphalt','pavement','speed bump','manhole','divider','footpath','carriageway','depression']},
 {cat:'Streetlight',kw:['streetlight','street light','lamp','light pole','lighting','dark street','flickering','pole light']},
 {cat:'Garbage / Waste',kw:['garbage','waste','bin','trash','litter','dump','debris','sanitation','sweep','smell']},
 {cat:'Water / Drainage',kw:['water','leak','drain','sewer','flood','pipe','stagnant','sewage','overflow']},
 {cat:'Public Safety',kw:['accident','danger','unsafe','signal','hazard','live wire','open wire','collapsed','fire','injur']}];
var SEV_KW=['large','deep','danger','accident','crash','collapse','burst','injur','huge'];
var IMPACT_KW=['school','hospital','market','junction','bus','park','playground','bazaar'];
var LOCI_KW=['main','junction','central','school','market','entrance','highway','bazaar'];
var URGEN_KW=['traffic','urgent','immediately','overflowing','flooding','leak','night','danger','accident','rush'];
var LOC_KEYS=[['school','School Road'],['junction','Central Junction'],['market','Market Road'],['bazaar','Main Bazaar'],['lake','Lake View Road'],['bus','Bus Stand Road'],['industrial','Industrial Estate Road'],['temple','Temple Street'],['river','River Side Road'],['coastal','Coastal Road'],['beach','Coastal Road']];
function tokens(t){return t.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(function(w){return w&&!STOP[w];});}
function inferLocation(text){var t=text.toLowerCase();for(var i=0;i<LOC_KEYS.length;i++){if(t.indexOf(LOC_KEYS[i][0])>=0)return LOC_KEYS[i][1];}return null;}
function simTokens(ta,tb,catEq,wardEq){
  if(!ta.length||!tb.length)return 0;
  var setB={},inter=0;tb.forEach(function(w){setB[w]=1;});
  ta.forEach(function(w){if(setB[w])inter++;});
  var containment=inter/Math.min(ta.length,tb.length);
  var precision=inter/ta.length;
  return Math.min(0.97,0.5*containment+(catEq?0.2:0)+(wardEq?0.1:0)+0.18*precision);
}
function classifyIssue(description,locName){
  var text=description.toLowerCase(),best={cat:'Other',hits:0};
  RULES.forEach(function(r){var h=0;r.kw.forEach(function(k){if(text.indexOf(k)>=0)h+=k.indexOf(' ')>=0?2:1;});if(h>best.hits)best={cat:r.cat,hits:h};});
  var category=best.cat,hits=best.hits;
  var ln=locName||inferLocation(description);
  var loc=ln&&LOCATIONS[ln]?LOCATIONS[ln]:null;
  var conf=87+Math.min(8,hits*4)+(loc?3:0)+(description.length>45?2:0);
  conf=Math.max(85,Math.min(98,conf));
  function has(a){return a.some(function(k){return text.indexOf(k)>=0;});}
  var fSev=has(SEV_KW)?25:has(['crack','flicker','litter'])?12:8;
  var fImp=has(IMPACT_KW)?22:10;
  var fLoc=has(LOCI_KW)?20:9;
  var fUrg=has(URGEN_KW)?15:6;
  var openSame=S?S.issues.filter(function(i){return i.category===category&&i.status!=='RESOLVED'&&i.status!=='DUPLICATE';}).length:1;
  var fFreq=Math.min(9,Math.round(openSame*4.5));
  var score=Math.min(100,fSev+fImp+fLoc+fUrg+fFreq);
  var priority=score>=70?'HIGH':score>=45?'MEDIUM':'LOW';
  var candidates=[];
  if(S&&S.prefs.duplicateDetection){
    var ta=tokens(description);
    S.issues.forEach(function(i){
      if(i.status==='RESOLVED'||i.status==='DUPLICATE')return;
      var wardEq=!!(loc&&i.location&&i.location.ward===loc.ward);
      var sim=simTokens(ta,tokens(i.description),true,wardEq);
      if(sim>=0.75)candidates.push({issue:i,sim:sim});
    });
    candidates.sort(function(a,b){return b.sim-a.sim;});candidates=candidates.slice(0,3);
  }
  return{category:category,confidence:conf,priority:priority,score:score,department:CAT_DEPT[category],
    factors:[{label:'Severity',max:25,val:fSev},{label:'Public Impact',max:22,val:fImp},{label:'Location Importance',max:20,val:fLoc},{label:'Urgency',max:15,val:fUrg},{label:'Reported Frequency',max:9,val:fFreq}],
    location:ln?{name:ln,ward:loc?loc.ward:12,lat:loc?loc.lat:13.079,lng:loc?loc.lng:80.27}:null,
    duplicates:candidates};
}

function genHistory(days){
  var out=[],rnd=mulberry32(20240612);
  var catW={'Road Damage':.30,'Streetlight':.15,'Garbage / Waste':.22,'Water / Drainage':.18,'Public Safety':.10,'Other':.05};
  for(var i=days;i>=0;i--){
    var ts=new Date();ts.setHours(0,0,0,0);ts.setTime(ts.getTime()-i*DAY);
    var dow=ts.getDay(),base=13+Math.floor(rnd()*7)-((dow===0||dow===6)?5:0);
    var count=Math.max(4,base),resolved=Math.round(count*(0.7+rnd()*0.16));
    var byCat={},byPri={HIGH:0,MEDIUM:0,LOW:0},byDept={};
    Object.keys(catW).forEach(function(c){byCat[c]=Math.round(count*catW[c]*(0.8+rnd()*0.4));});
    var tot=0;Object.keys(byCat).forEach(function(c){tot+=byCat[c];});byCat['Road Damage']+=count-tot;
    byPri.HIGH=Math.round(count*(0.16+rnd()*0.05));byPri.MEDIUM=Math.round(count*(0.46+rnd()*0.06));byPri.LOW=count-byPri.HIGH-byPri.MEDIUM;
    DEPTS.forEach(function(d){byDept[d]=0;});Object.keys(byCat).forEach(function(c){byDept[CAT_DEPT[c]]+=byCat[c];});
    out.push({ts:ts.getTime(),count:count,resolved:resolved,byCat:byCat,byPri:byPri,byDept:byDept});
  }
  return out;
}

 },

function gaugeSVG(value,color,size,stroke){
  size=size||124;stroke=stroke||11;
  var r=(size-stroke)/2,c=2*Math.PI*r,arc=c*0.75,v=Math.max(0,Math.min(100,value));
  return '<span class="gaugewrap" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'">'
   +'<g transform="rotate(135 '+(size/2)+' '+(size/2)+')">'
   +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#E9EBEF" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+arc+' '+c+'"/>'
   +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+(arc*v/100)+' '+c+'" style="transition:stroke-dasharray 1s cubic-bezier(.2,.7,.3,1)"/></g></svg>'
   +'<span class="gv">'+gaugeInner(value,color)+'</span></span>';
}
function gaugeInner(value,color){return '';}
function gaugeCenter(content,size){return '<span class="gv">'+content+'</span>';}
function gaugeWrap(value,color,size,stroke,center){
  size=size||124;stroke=stroke||11;
  var r=(size-stroke)/2,c=2*Math.PI*r,arc=c*0.75,v=Math.max(0,Math.min(100,value));
  return '<span class="gaugewrap" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'">'
   +'<g transform="rotate(135 '+(size/2)+' '+(size/2)+')">'
   +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#E9EBEF" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+arc+' '+c+'"/>'
   +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+(arc*v/100)+' '+c+'" style="transition:stroke-dasharray 1s cubic-bezier(.2,.7,.3,1)"/></g></svg>'
   +'<span class="gv">'+center+'</span></span>';
}
function lineChart(data,h,color){
  h=h||200;color=color||'#1F6FEB';
  var w=640,pl=38,pr=10,pt=12,pb=24;
  var max=Math.max.apply(null,data.map(function(d){return d.y;}).concat([4]));
  function X(i){return pl+(w-pl-pr)*(data.length<2?0.5:i/(data.length-1));}
  function Y(v){return pt+(h-pt-pb)*(1-v/max);}
  var line=data.map(function(d,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(d.y).toFixed(1);}).join(' ');
  var area=line+' L '+X(data.length-1).toFixed(1)+' '+(h-pb)+' L '+X(0).toFixed(1)+' '+(h-pb)+' Z';
  var g='',dots='',labels='';
  [0,.25,.5,.75,1].forEach(function(f){var y=Y(max*f).toFixed(1);
    g+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#EEF0F3"/><text x="'+(pl-6)+'" y="'+(Number(y)+3)+'" text-anchor="end" font-size="9" fill="#98A2B3" font-family="JetBrains Mono">'+Math.round(max*f)+'</text>';});
  var step=Math.ceil(data.length/7);
  data.forEach(function(d,i){
    if(data.length<=8||i%step===0)labels+='<text x="'+X(i).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-size="9" fill="#98A2B3">'+esc(d.l)+'</text>';
    dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(d.y).toFixed(1)+'" r="2.4" fill="#fff" stroke="'+color+'" stroke-width="1.8"><title>'+esc(d.l)+' · '+d.y+'</title></circle>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px" preserveAspectRatio="none">'+g
   +'<path d="'+area+'" fill="'+color+'" opacity="0.09"/><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+dots+labels+'</svg>';
}
function donut(data,size,thick,centerTop,centerSub){
  size=size||168;thick=thick||24;
  var total=data.reduce(function(a,d){return a+d.v;},0)||1;
  var r=(size-thick)/2,c=2*Math.PI*r,acc=0,segs='';
  data.forEach(function(d){var frac=d.v/total;
    segs+='<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="'+thick+'" stroke-dasharray="'+(frac*c)+' '+c+'" stroke-dashoffset="'+(-acc*c)+'"><title>'+esc(d.l)+': '+fnum(d.v)+'</title></circle>';
    acc+=frac;});
  var legend=data.map(function(d){return '<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px">'
   +'<i class="dot" style="width:10px;height:10px;border-radius:3px;background:'+d.color+'"></i>'
   +'<span style="color:var(--ink7);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.l)+'</span>'
   +'<span class="mono" style="font-weight:600">'+fnum(d.v)+'</span>'
   +'<span class="mono" style="color:var(--ink4);width:36px;text-align:right">'+Math.round(d.v/total*100)+'%</span></div>';}).join('');
  return '<div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center">'
   +'<span class="gaugewrap" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">'+segs+'</svg>'
   +'<span class="gv"><span class="disp" style="font-weight:800;font-size:20px;color:var(--navy)">'+centerTop+'</span><span style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ink4);text-transform:uppercase">'+centerSub+'</span></span></span>'
   +'<div style="min-width:180px;flex:1">'+legend+'</div></div>';
}

function projXY(lat,lng,w,h){
  var minLa=13.048,maxLa=13.106,minL=80.246,maxL=80.296;
  return{x:(lng-minL)/(maxL-minL),y:1-(lat-minLa)/(maxLa-minLa)};
}
function destroyMap(){if(MAP){try{MAP.remove();}catch(e){}MAP=null;}}
function buildMap(){
  var el=$('#civmap');if(!el)return;
  destroyMap();
  var issues=filteredMapIssues();
  if(typeof L!=='undefined'){
    var mini=el.classList.contains('mini');
    var single=el.dataset.issue;
    if(single){var one=getIssue(single);
      MAP=L.map(el,{zoomControl:false,dragging:false,scrollWheelZoom:false,attributionControl:false,doubleClickZoom:false,boxZoom:false});
      MAP.setView([one.location.lat,one.location.lng],15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(MAP);
      var c=one.status==='RESOLVED'?'#178A4C':one.priority==='HIGH'?'#D92D20':one.priority==='MEDIUM'?'#F25C05':'#1F6FEB';
      L.circleMarker([one.location.lat,one.location.lng],{radius:9,color:'#fff',weight:2.5,fillColor:c,fillOpacity:1}).addTo(MAP);
      return;
    }
    MAP=L.map(el,{zoomControl:true,scrollWheelZoom:false});
    MAP.setView([13.0780,80.2740],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(MAP);
    var layer=L.layerGroup().addTo(MAP);
    var byId={};
    issues.forEach(function(i){
      var col=mapColor(i);
      if(ui.mapF.heat){
        L.circle([i.location.lat,i.location.lng],{radius:170,color:col,weight:0,fillColor:col,fillOpacity:0.16}).addTo(layer).bindTooltip(i.id+' · '+i.location.name);
      }else{
        var pulse=(i.priority==='HIGH'&&i.status!=='RESOLVED')?'pulse':'';
        var m=L.marker([i.location.lat,i.location.lng],{icon:L.divIcon({className:'',html:'<div class="pin '+pulse+'" style="--c:'+col+'"><i></i></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(layer);
        m.bindPopup(popupHTML(i),{maxWidth:300});
        byId[i.id]=m;
      }
    });
    MAP._byId=byId;
    if(ui.mapF.fly){var mm=byId[ui.mapF.fly];if(mm){MAP.flyTo(mm.getLatLng(),15,{duration:.6});setTimeout(function(){mm.openPopup();},650);}}
    ui.mapF.fly=null;
  }else{
    /* fallback: projected dot map, no dependency */
    var heat=ui.mapF.heat;
    var dots=issues.map(function(i){
      var p=projXY(i.location.lat,i.location.lng),col=mapColor(i);
      var pulse=(i.priority==='HIGH'&&i.status!=='RESOLVED')?'pulse':'';
      return '<div class="fdot '+pulse+'" data-fdot="'+i.id+'" title="'+esc(i.id)+' — '+esc(i.title)+'" style="left:'+(p.x*100)+'%;top:'+(p.y*100)+'%;background:'+col+';--c:'+col+(heat?';opacity:.22;width:56px;height:56px;margin:-28px;':'')+'"></div>';
    }).join('');
    el.innerHTML='<div class="fmap">'+dots+'</div>';
    var flyEl=el.querySelector('[data-fdot="'+ui.mapF.fly+'"]');
    ui.mapF.fly=null;
    if(flyEl)openFPop(el,getIssue(flyEl.getAttribute('data-fdot')));
  }
}

  d.style.left=Math.min(78,p.x*100)+'%';d.style.top=Math.min(72,p.y*100)+'%';
  d.innerHTML=popupHTML(i)+'<button aria-label="Close" style="position:absolute;top:8px;right:8px;color:var(--ink4)">'+ic('x',14)+'</button>';

  return{total:1233+live.length,
   open:323+live.filter(function(i){return i.status==='NEW';}).length,
   prog:139+live.filter(function(i){return i.status==='IN_PROGRESS';}).length,
   resolved:775+live.filter(function(i){return i.status==='RESOLVED';}).length,
   conf:confN?confSum/confN:0,

}

function citSubmit(){
  var c=ui.cit;
  if(c.desc.trim().length<10){toast('Please describe the issue (at least 10 characters)','alert');return;}
  var useAI=S.prefs.aiClassification&&!c.cat;
  if(!useAI){
    var res0=classifyIssue(c.desc,citEffectiveLoc()||undefined);
    res0.category=c.cat;res0.department=CAT_DEPT[c.cat];res0.confidence=null;
    res0.title=c.desc.charAt(0).toUpperCase()+c.desc.split('.')[0].slice(1,80);
    citCreate(res0,null);return;
  }
  toast('Analyzing report...','info');
  var res=classifyIssue(c.desc,citEffectiveLoc()||undefined);
  res.title=c.desc.charAt(0).toUpperCase()+c.desc.split('.')[0].slice(1,80);
  res.dupSim=res.duplicates.length?res.duplicates[0].sim:0;
  c.result=res;c.mergedWith=null;c.phase='analyzing';c.steps=0;
  render();
  AI_STAGES.forEach(function(_,ix){citTimers.push(setTimeout(function(){c.steps=ix+1;render();},650*(ix+1)));});
  citTimers.push(setTimeout(function(){c.phase='result';toast('AI classification complete.','ok');render();},650*AI_STAGES.length+450));
}
function citCreate(res,merged){
  var c=ui.cit;
  c.createdId=api.createFromAnalysis(res,{description:c.desc,title:res.title,phone:c.phone,photo:c.photo,voiceSec:c.rec?c.rec.sec:null,mergedWith:merged});
  c.phase='done';
  toast(merged?'Reports successfully consolidated.':'Civic work item '+c.createdId+' created.','ok');
  citTimers.push(setTimeout(function(){toast(res.priority==='HIGH'?'Queued at the top of the dispatch board':'Routed to '+res.department,'info',{label:'View issue',fn:function(){go('/issues/'+c.createdId);}});},900));
  render();
}
function citToggleRec(){
  var c=ui.cit;
  if(c.recording){c.recording=false;toast('Voice note captured','info');render();return;}
  c.recording=true;render();
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var chunks=[],t0=Date.now(),mr;
      try{mr=new MediaRecorder(stream);}catch(e){stream.getTracks().forEach(function(t){t.stop();});c.recording=false;c.rec={sec:3,sim:true};toast('Recording unsupported — voice memo simulated','alert');render();return;}
      mr.ondataavailable=function(e){chunks.push(e.data);};
      mr.onstop=function(){stream.getTracks().forEach(function(t){t.stop();});
        if(c.recording===false&&!c.rec&&chunks.length===0)return;
        c.rec={sec:Math.max(2,Math.round((Date.now()-t0)/1000)),url:URL.createObjectURL(new Blob(chunks))};c.recording=false;render();};
      mr.start();
      setTimeout(function(){if(mr.state==='recording'){mr.stop();c.recording=false;toast('Voice note captured (max 30s)','info');render();}},30000);
    }).catch(function(){c.recording=false;c.rec={sec:3,sim:true};toast('Microphone unavailable — voice memo simulated','alert');render();});
  }else{
    setTimeout(function(){c.recording=false;c.rec={sec:3,sim:true};toast('Microphone unavailable — voice memo simulated','alert');render();},2500);
  }
}

/* ---------- Issue registry ---------- */
function registryFiltered(){
  var f=ui.reg;
  var rows=S.issues.filter(function(i){
    if(f.q){var t=f.q.toLowerCase();
      if(i.id.toLowerCase().indexOf(t)<0&&i.title.toLowerCase().indexOf(t)<0&&i.description.toLowerCase().indexOf(t)<0&&i.location.name.toLowerCase().indexOf(t)<0)return false;}
    if(f.cat!=='ALL'&&i.category!==f.cat)return false;
    if(f.pri!=='ALL'&&i.priority!==f.pri)return false;
    if(f.dept!=='ALL'&&i.department!==f.dept)return false;
    if(f.status!=='ALL'&&i.status!==f.status)return false;
    if(f.date!=='ALL'){var cut=Date.now()-({'24h':DAY,'7d':7*DAY,'30d':30*DAY}[f.date]||0);if(i.reportedAt<cut)return false;}
    if(f.conf!=='0'&&(i.confidence||0)<+f.conf)return false;
    return true;});
  var key=f.sort;
  rows.sort(function(a,b){
    var va,vb;
    if(key==='score'){va=a.score;vb=b.score;}
    else if(key==='confidence'){va=a.confidence||0;vb=b.confidence||0;}
    else if(key==='id'){va=+String(a.id).slice(3);vb=+String(b.id).slice(3);}
    else if(key==='priority'){va={HIGH:3,MEDIUM:2,LOW:1}[a.priority];vb={HIGH:3,MEDIUM:2,LOW:1}[b.priority];}
    else{va=a.reportedAt;vb=b.reportedAt;}
    return (va>vb?1:va<vb?-1:0)*f.dir;});
  return rows;
}

function dispatchMove(id,col){
  var i=getIssue(id);if(!i||i.status===col)return;
  if(col==='ASSIGNED'&&!i.team){ui.assign=id;ui.assignTeam=TEAMS[i.department][0];renderOvl();return;}
  if(col==='RESOLVED'&&i.status!=='VERIFICATION'){
    openConfirm('Skip verification?','This issue has not been submitted for verification. Best practice is evidence review before resolution — resolve directly anyway?','Resolve directly',function(){api.submitEvidence(id);setTimeout(function(){api.approve(id);},400);});
    return;}
  if(col==='ASSIGNED')api.assign(id,i.team);
  else if(col==='IN_PROGRESS')api.start(id);
  else if(col==='VERIFICATION'){api.submitEvidence(id);setTimeout(function(){api.submitVerification(id);},300);}
  else if(col==='RESOLVED')api.approve(id);
  else if(col==='NEW'){i.status='NEW';i.team=null;tlAdd(i,'Returned to intake queue','warn');toast(id+' returned to intake','info');}
  commit();
}

/* ---------- Analytics ---------- */
function viewAnalytics(){
  var rangeMap={today:1,'7d':7,'30d':30,'90d':90};
  var days=rangeMap[ui.range];
  var hist=S.history.slice(-days);
  var totals={count:0,resolved:0,byCat:{},byDept:{}};
  CATS.forEach(function(c){totals.byCat[c]=0;});DEPTS.forEach(function(d){totals.byDept[d]=0;});
  hist.forEach(function(h){totals.count+=h.count;totals.resolved+=h.resolved;
    Object.keys(h.byCat).forEach(function(c){totals.byCat[c]=(totals.byCat[c]||0)+h.byCat[c];});
    DEPTS.forEach(function(d){totals.byDept[d]+=h.byDept[d]||0;});});
  var live=S.issues.filter(function(i){return i.reportedAt>Date.now()-days*DAY;});
  totals.count+=live.length;totals.resolved+=live.filter(function(i){return i.status==='RESOLVED';}).length;
  var series;
  if(ui.range==='today'){
    var hourly=[2,1,1,1,2,3,5,8,11,12,10,9,8,8,9,10,12,13,11,8,6,4,3,2];
    var sum=hourly.reduce(function(a,b){return a+b;},0);
    var base=hist.length?hist[hist.length-1].count:12;
    series=hourly.map(function(v,ix){return{l:pad(ix)+':00',y:Math.round(v/sum*base*1.4)};});
  }else{
    series=hist.map(function(h){return{l:fdate(h.ts),y:h.count};});
  }
  var step=Math.ceil(series.length/14);
  var lineData=series.filter(function(_,ix){return series.length<=16||ix%step===0;});
  var donutData=CATS.map(function(c,ix){return{l:c,v:totals.byCat[c]||0,color:PAL[ix]};}).filter(function(d){return d.v>0;});
  var rate=Math.round(totals.resolved/Math.max(1,totals.count)*100);
  var stackDays=S.history.slice(-7).map(function(h){return{l:fdate(h.ts),h:h.byPri.HIGH,m:h.byPri.MEDIUM,l:h.byPri.LOW};});
  var confBuckets=[{l:'85–88%',v:0},{l:'89–91%',v:0},{l:'92–94%',v:0},{l:'95–98%',v:0}];
  S.issues.forEach(function(i){if(i.confidence==null)return;
    if(i.confidence<=88)confBuckets[0].v++;else if(i.confidence<=91)confBuckets[1].v++;else if(i.confidence<=94)confBuckets[2].v++;else confBuckets[3].v++;});
  var confN=S.issues.filter(function(i){return i.confidence!=null;}).length;
  var activeByDept=DEPTS.map(function(d,ix){return{l:d,v:S.issues.filter(function(i){return i.department===d&&i.status!=='RESOLVED'&&i.status!=='DUPLICATE';}).length,color:PAL[ix]};});
  var resByDept=DEPTS.map(function(d){return{l:d.split(' /')[0],v:S.deptBase[d].avg,color:'#F25C05'};});
  function card(title,icon,sub,body){return '<div class="card" style="padding:20px"><div class="sect"><h2>'+ic(icon,16)+title+'</h2></div>'+(sub?'<p class="sub" style="margin:-8px 0 14px">'+sub+'</p>':'')+body+'</div>';}
  return '<div style="display:flex;flex-direction:column;gap:18px">'
  +'<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">'
  +'<div style="display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px">'
  +['today','7d','30d','90d'].map(function(r){return '<button data-act="range" data-r="'+r+'" style="padding:0 14px;height:32px;border-radius:7px;font-size:12.5px;font-weight:700;'+(ui.range===r?'background:var(--navy);color:#fff':'color:var(--ink5)')+'">'+(r==='today'?'Today':r.replace('d',' Days'))+'</button>';}).join('')+'</div>'
  +'<span style="font-size:12px;color:var(--ink4)">Network archive (90-day synthetic history) + live registry</span></div>'
  +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px" class="gan">'
  +card('Reports Over Time','activity',ui.range==='today'?'Hourly intake — today':'Daily intake — last '+days+' days','<div style="width:100%;grid-column:1/-1">'+lineChart(lineData,210,'#1F6FEB')+'</div>')
  +card('Issues by Category','layers','Distribution over '+days+'-day window',donut(donutData,168,24,fnum(totals.count),'reports'))
  +card('Resolution Rate','checkc','Verified resolutions vs total intake',
    '<div style="display:flex;justify-content:center;padding:8px 0">'+gaugeWrap(rate,'var(--ok)',150,13,'<span class="disp" style="font-weight:800;font-size:28px;color:var(--ok)">'+rate+'%</span><span style="font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--ink4)">RESOLVED</span>')+'</div>'
    +'<div class="g2" style="margin-top:10px;text-align:center"><div style="background:var(--paper);border-radius:9px;padding:10px"><div class="disp" style="font-weight:700;font-size:18px">'+fnum(totals.resolved)+'</div><div class="lbl" style="margin:2px 0 0">Resolved</div></div>'
    +'<div style="background:var(--paper);border-radius:9px;padding:10px"><div class="disp" style="font-weight:700;font-size:18px">'+fnum(totals.count-totals.resolved)+'</div><div class="lbl" style="margin:2px 0 0">In pipeline</div></div></div>')
  +card('Priority Distribution','target','Stacked daily mix — last 7 days',stackedBars(stackDays))
  +card('AI Classification Confidence','cpu','Current live registry',
    histogram(confBuckets)
    +'<p style="font-size:11px;color:var(--ink4);margin-top:12px">Average confidence: <b class="mono" style="color:var(--elec)">'+(confN?(S.issues.reduce(function(a,i){return a+(i.confidence||0);},0)/confN).toFixed(1):0)+'%</b></p>')
  +card('Department Workload','building','Active (unresolved) issues — live',hbars(activeByDept))
  +card('Average Resolution Time','clock','Hours from report to verified resolution',hbars(resByDept,' h'))
  +card('Duplicate Fusion Performance','merge','How effectively repeat complaints are consolidated',
    '<div class="g3">'
    +[['Reports merged (30 days)',S.duplicateStats.mergedThisMonth,'#1F6FEB'],['Fusion rate',S.duplicateStats.fusionRate+'%','#F25C05'],['Duplicates in registry',S.issues.filter(function(i){return i.status==='DUPLICATE';}).length,'#667085']].map(function(x){
      return '<div style="border:1px solid var(--line);border-radius:12px;padding:16px"><div class="disp" style="font-weight:800;font-size:24px;color:'+x[2]+'">'+x[1]+'</div>'
      +'<div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink5);text-transform:uppercase;margin-top:4px">'+x[0]+'</div></div>';}).join('')+'</div>')
  +'</div></div>';
}

function presRun(){
  var p=ui.pres;
  if(p.running)return;
  p.running=true;p.done=false;p.feed=[];p.stage=0;p.created=null;
  var res=null,id=null;
  function feedAdd(t){p.feed.unshift(t);}
  var chain=[
   [900,function(){res=classifyIssue(CANON.d,CANON.loc);feedAdd('Citizen report received — School Road, Ward 12');feedAdd('AI classified · Road Damage · '+res.confidence+'% confidence');}],
   [900,function(){feedAdd('Location resolved · School Road · Ward 12 · GIS pinned');p.stage=2;}],
   [900,function(){feedAdd('Priority scored '+res.score+'/100 → '+res.priority);id=api.createFromAnalysis(res,{description:CANON.d,title:'Large pothole near school entrance',reporter:'Presentation flow'});p.created=id;p.stage=3;}],
   [1400,function(){feedAdd('Duplicate check · '+(res.duplicates[0]?res.duplicates[0].issue.id+' ('+Math.round(res.dupSim*100)+'%) — fused':'no duplicates'));}],
   [1100,function(){api.assign(id,'Roads Team 04');feedAdd('Dispatched → Roads Team 04 · SLA 4h running');p.stage=4;}],
   [1600,function(){api.start(id);feedAdd('Field team on site · work started');}],
   [1500,function(){api.submitEvidence(id);setTimeout(function(){api.submitVerification(id);},300);feedAdd('Evidence uploaded · verification engine '+(getIssue(id).verifyConf||93)+'%');p.stage=5;}],
   [1800,function(){api.approve(id);feedAdd('Resolution VERIFIED · '+id+' → RESOLVED');p.running=false;renderOvl();}]];
  var acc=200;
  chain.forEach(function(c){acc+=c[0];setTimeout(function(){c[1]();if(ui.present)renderOvl();},acc);});
}

  else if(seg[0]==='citizen'){main=citizenShell();}

      case'dispatch':body=viewDispatch();break;
      case'gis':body=viewGis();break;
      case'analytics':body=viewAnalytics();break;
      case'departments':body=seg[1]?viewDeptDetail(decodeURIComponent(seg[1])):viewDepartments();break;
      case'notifications':body=viewNotifications();break;
      case'field':body=viewField();break;

      default:body='<div class="card" style="max-width:420px;margin:60px auto">'+emptyState('help','Page not found','The route you requested doesn\'t exist in this prototype.','<button class="btn p" data-act="go" data-p="/dashboard">Back to Dashboard</button>')+'</div>';
    }
    main=adminShell(r,body);

/* ---------- kanban drag binding ---------- */
function bindKanban(){
  $$('.kcard').forEach(function(card){
    card.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',card.getAttribute('data-kcid'));e.dataTransfer.effectAllowed='move';card.classList.add('ghost');});
    card.addEventListener('dragend',function(){card.classList.remove('ghost');});
  });
  $$('.kcol').forEach(function(col){
    col.addEventListener('dragover',function(e){e.preventDefault();col.classList.add('over');});
    col.addEventListener('dragleave',function(){col.classList.remove('over');});
    col.addEventListener('drop',function(e){e.preventDefault();col.classList.remove('over');
      var id=e.dataTransfer.getData('text/plain');if(id)dispatchMove(id,col.getAttribute('data-col'));});
  });
}

document.addEventListener('click',function(ev){

      case'notif-go':var nn2=S.notifications.filter(function(x){return x.id===id;})[0];if(nn2)nn2.read=true;ui.notifOpen=false;commit();if(nn2&&nn2.issueId)go('/issues/'+nn2.issueId);break;
      case'assign-open':ui.assign=id;ui.assignTeam='';renderOvl();break;

      case'start':api.start(id);commit();break;

      case'approve':api.approve(id);commit();break;

      case'page':ui.reg.page+= +el.getAttribute('data-d');render();break;
      case'clear-filters':ui.reg={q:'',cat:'ALL',pri:'ALL',dept:'ALL',status:'ALL',date:'ALL',conf:'0',sort:'reportedAt',dir:-1,page:0};render();break;

    if(e.key==='Escape'){
      var btn=document.querySelector('[data-act="menu-close"]'); if(btn) btn.click();
    }
  });
  window.addEventListener('hashchange',function(){
    var r=parseRoute(); if(r.path!==lastRoute){lastRoute=r.path;document.documentElement.classList.remove('route-enter');void document.documentElement.offsetWidth;document.documentElement.classList.add('route-enter');}
  });
  setTimeout(function(){var r=parseRoute();lastRoute=r.path;document.documentElement.classList.add('route-enter');},30);
})();


/* =====================================================================
   boot
===================================================================== */
try{
  storeLoad();
  render();
}catch(err){
  showFatal('Boot failure: '+err.message);
  try{render();}catch(e2){}
}
/* periodic SLA/clock refresh without full re-render */
setInterval(function(){
  var c=$('[data-clock]');if(c)c.textContent=clock(Date.now());
  $$('.sla-chip').forEach(function(el){
    var i=getIssue(el.getAttribute('data-iss'));if(!i)return;
    var fresh=slaChip(i);
    if(fresh&&el.parentNode)el.outerHTML=fresh;
    else if(el.parentNode)el.parentNode.removeChild(el);
  });
},15000);
})();
</script>
</body>
</html>
